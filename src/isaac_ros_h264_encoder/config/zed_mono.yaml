encoder:
  # Input image resolution — must match the camera driver configuration
  input_width: 1920
  input_height: 1080

  # Encoder profile: iframe_cqp (keyframe-only, good for recording/streaming)
  #                  pframe_cqp (predictive, lower bitrate, higher CPU)
  config: iframe_cqp

  # QoS of the incoming image topics published by the camera driver.
  # Must match the publisher or subscriptions will silently receive nothing.
  # SENSOR_DATA = best-effort/volatile (ZED, RealSense default)
  # SYSTEM_DEFAULT = reliable/volatile
  image_qos: SENSOR_DATA

  # Input topics from the camera driver (left and right rectified color)
  image_topic: /zed/zed_node/rgb/color/rect/image

  # Output topics for the compressed stream
  compressed_topic: /zed/zed_node/rgb/color/rect/image_h264
